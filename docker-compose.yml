# ======================================================
# Stack completo: API FastAPI + PostgreSQL
# Levantar con: docker compose up --build -d
# ======================================================
services:

  db:
    image: postgres:16-alpine
    container_name: monitor_db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      # Los datos persisten aunque bajes los contenedores
      - pgdata:/var/lib/postgresql/data
      # Scripts que corren SOLO la primera vez (crean la BD de tests)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Opcional: te deja conectarte desde pgAdmin/DBeaver de tu máquina
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: monitor_api
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres esté listo de verdad
    env_file:
      # SECRET_KEY y credenciales MQTT salen de acá (copiá .env.example -> .env)
      - path: .env
        required: false
    environment:
      # Estas dos SIEMPRE pisan lo que diga el .env, porque dentro de la red
      # de Docker el host de la base es "db", no "localhost".
      DATABASE_URL: postgresql://monitor:monitor@db:5432/monitor
      TEST_DATABASE_URL: postgresql://monitor:monitor@db:5432/monitor_test
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
