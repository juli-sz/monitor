<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios | Telemetría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    #sidebar { height: 100vh; position: fixed; width: 220px; top: 0; left: 0; }
    .main-content { margin-left: 220px; padding: 20px; }
    .usuario-inactivo { opacity: 0.6; }
  </style>
</head>
<body>

  <nav id="sidebar" class="bg-dark text-white p-3">
    <h4 class="mb-4 text-center">🩺 Telemetría</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a href="panel.html" class="nav-link text-white">📊 Panel (Index)</a></li>
      <li class="nav-item mb-2"><a href="pacientes.html" class="nav-link text-white">👥 Pacientes</a></li>
      <li class="nav-item mb-2"><a href="equipos.html" class="nav-link text-white">📻 Equipos</a></li>
      <li class="nav-item mb-2"><a href="sensores.html" class="nav-link text-white">📈 Sensores</a></li>
      <li class="nav-item mb-2"><a href="alarmas.html" class="nav-link text-white">⚠️ Alarmas</a></li>
      <li class="nav-item mb-2 mt-4 border-top pt-2"><a href="usuarios.html" class="nav-link text-info fw-bold">⚙️ Usuarios</a></li>
    </ul>
    <div class="mt-auto pt-4">
      <button class="btn btn-outline-danger w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Gestión de Usuarios del Sistema</h3>
      <button class="btn btn-success" onclick="abrirModalUsuario()">+ Nuevo Usuario</button>
    </div>

    <div class="table-responsive bg-white p-3 rounded shadow-sm">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios">
          </tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Crear Nuevo Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formUsuario">
            <div class="mb-3">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="u-nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo Electrónico (Email)</label>
              <input type="email" class="form-control" id="u-email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="u-password" required minlength="6">
            </div>
            <div class="mb-4">
              <label class="form-label">Rol en el sistema</label>
              <select class="form-select" id="u-rol" required>
                <option value="admin">Administrador (Acceso Total)</option>
                <option value="medico">Médico (Diagnósticos y Ajustes)</option>
                <option value="enfermero">Enfermero (Monitor y Alertas)</option>
                <option value="visor">Visor (Solo Lectura)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear Usuario</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "http://localhost:8000/usuarios";
    const token = localStorage.getItem("token");
    const userRole = localStorage.getItem("userRole");
    const modalUsuario = new bootstrap.Modal(document.getElementById('modalUsuario'));

    // Control de seguridad: Si no es admin, lo pateamos al panel
    if (!token) window.location.replace("../login.html");
    if (userRole !== "admin") {
        alert("Acceso denegado. Solo los administradores pueden gestionar usuarios.");
        window.location.replace("panel.html");
    }

    // 1. Cargar Usuarios
    async function cargarUsuarios() {
      try {
        const res = await fetch(API_URL, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const usuarios = await res.json();
        const tbody = document.getElementById("tabla-usuarios");
        tbody.innerHTML = "";

        usuarios.forEach(u => {
          const badgeRol = `<span class="badge bg-secondary">${u.rol.toUpperCase()}</span>`;
          const badgeEstado = u.activo 
            ? `<span class="badge bg-success">Activo</span>` 
            : `<span class="badge bg-danger">Inactivo</span>`;
          
          const btnEstado = u.activo
            ? `<button class="btn btn-sm btn-outline-danger" onclick="cambiarEstado(${u.id_usuario}, false)">Dar de Baja</button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="cambiarEstado(${u.id_usuario}, true)">Reactivar</button>`;

          tbody.innerHTML += `
            <tr class="${u.activo ? '' : 'usuario-inactivo'}">
              <td class="fw-bold">${u.nombre}</td>
              <td>${u.email}</td>
              <td>${badgeRol}</td>
              <td>${badgeEstado}</td>
              <td class="text-end">${btnEstado}</td>
            </tr>
          `;
        });
      } catch (e) {
        console.error("Error al cargar usuarios:", e);
      }
    }

    // 2. Crear Usuario
    document.getElementById("formUsuario").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const payload = {
        nombre: document.getElementById("u-nombre").value,
        email: document.getElementById("u-email").value,
        password: document.getElementById("u-password").value,
        rol: document.getElementById("u-rol").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById("formUsuario").reset();
          modalUsuario.hide();
          cargarUsuarios();
          alert("Usuario creado con éxito.");
        } else {
          const err = await res.json();
          alert("Error: " + (err.detail || "No se pudo crear el usuario"));
        }
      } catch (e) {
        alert("Error de conexión con el servidor.");
      }
    });

    // 3. Cambiar Estado (Baja/Alta)
    async function cambiarEstado(id_usuario, activando) {
      const accion = activando ? "reactivar" : "dar de baja";
      if (!confirm(`¿Estás seguro de que deseas ${accion} a este usuario?`)) return;

      try {
        const res = await fetch(`${API_URL}/${id_usuario}/estado`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          cargarUsuarios();
        } else {
          alert("Error al cambiar el estado del usuario.");
        }
      } catch (e) {
        alert("Error de conexión.");
      }
    }

    function abrirModalUsuario() {
      document.getElementById("formUsuario").reset();
      modalUsuario.show();
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.replace("../login.html");
    }

    // Arrancamos
    cargarUsuarios();
  </script>
</body>
</html>
