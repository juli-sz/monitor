<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Alarmas | Telemetría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    #sidebar { height: 100vh; position: fixed; width: 220px; }
    .main-content { margin-left: 220px; padding: 20px; }
    .alerta-activa { border-left: 5px solid #dc3545; background-color: #fff3f3; }
    .alerta-resuelta { border-left: 5px solid #198754; opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Barra Lateral -->
  <nav id="sidebar" class="bg-dark text-white p-3">
    <h4 class="mb-4 text-center">🩺 Telemetría</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a href="panel.html" class="nav-link text-white">📊 Panel (Index)</a></li>
      <li class="nav-item mb-2"><a href="pacientes.html" class="nav-link text-white">👥 Pacientes</a></li>
      <li class="nav-item mb-2"><a href="equipos.html" class="nav-link text-white">📻 Equipos</a></li>
      <li class="nav-item mb-2"><a href="sensores.html" class="nav-link text-white">📈 Sensores</a></li>
      <li class="nav-item mb-2"><a href="alarmas.html" class="nav-link text-danger fw-bold">⚠️ Alarmas</a></li>
    </ul>
    <div class="mt-auto pt-4">
      <button class="btn btn-outline-danger w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Historial de Alarmas</h3>
      <button class="btn btn-primary" onclick="cargarAlarmas()">🔄 Actualizar</button>
    </div>

    <div class="row" id="contenedor-alarmas">
      <!-- Las alertas se inyectarán aquí -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "http://localhost:8000/alertas"; // Asumiendo este endpoint[cite: 2]
    const token = localStorage.getItem("token");
    const userRole = localStorage.getItem("userRole");

    if (!token) window.location.replace("../login.html");

    // Función 1: Traer las alarmas reales de la base de datos
    async function cargarAlarmas() {
      const contenedor = document.getElementById("contenedor-alarmas");
      contenedor.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary" role="status"></div></div>';

      try {
        const res = await fetch(API_URL, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (!res.ok) throw new Error("Error al cargar las alarmas");
        
        const alarmas = await res.json();
        contenedor.innerHTML = "";

        if (alarmas.length === 0) {
          contenedor.innerHTML = `<div class="col-12"><p class="text-muted">No hay alarmas registradas.</p></div>`;
          return;
        }

        alarmas.forEach(a => {
          const esActiva = a.estado === "ACTIVA";
          const claseCard = esActiva ? "alerta-activa" : "alerta-resuelta";
          const badge = esActiva ? `<span class="badge bg-danger">ACTIVA</span>` : `<span class="badge bg-success">RESUELTA</span>`;
          
          // El botón para resolver alarma solo se muestra si está activa y si el rol lo permite
          const btnResolver = (esActiva && userRole === "admin") ? 
            `<button class="btn btn-sm btn-danger mt-2" onclick="resolverAlarma(${a.id})">Marcar como Resuelta</button>` : '';

          contenedor.innerHTML += `
            <div class="col-md-6 mb-3">
              <div class="card shadow-sm ${claseCard}">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <h5 class="card-title text-dark">Alarma: ${a.sensor}</h5>
                    ${badge}
                  </div>
                  <p class="mb-1"><strong>Paciente:</strong> ${a.paciente}</p>
                  <p class="mb-1"><strong>Valor detectado:</strong> <span class="text-danger fw-bold">${a.valor}</span></p>
                  <p class="text-muted small mb-0">Hora: ${a.fecha}</p>
                  ${btnResolver}
                </div>
              </div>
            </div>
          `;
        });
      } catch (error) {
          console.error(error);
          contenedor.innerHTML = `<div class="col-12"><p class="text-danger">Hubo un problema de conexión con el servidor.</p></div>`;
      }
    }

    // Función 2: Ejecutar el PATCH real en el backend
    async function resolverAlarma(id) {
      if (!confirm("¿Confirmas que esta situación médica fue atendida?")) return;
      
      try {
          const res = await fetch(`${API_URL}/${id}/resolver`, { 
              method: "PATCH", 
              headers: { "Authorization": `Bearer ${token}` } 
          });
          
          if (res.ok) {
              cargarAlarmas(); // Recargamos la lista automáticamente
          } else {
              alert("Error al intentar resolver la alarma.");
          }
      } catch (error) {
          console.error(error);
          alert("Error de conexión al resolver la alarma.");
      }
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.replace("../login.html");
    }

    // Carga inicial
    cargarAlarmas();
  </script>
</body>
</html>
