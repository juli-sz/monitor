name: Tests

# Corre la suite de pytest contra un PostgreSQL real levantado como servicio.
# Hace falta una base de verdad (no SQLite) porque el modelo ECG usa ARRAY,
# que es un tipo exclusivo de Postgres.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          # El nombre DEBE contener "test": conftest.py se niega a correr si no,
          # porque cada test trunca todas las tablas.
          POSTGRES_DB: monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://monitor:monitor@localhost:5432/monitor_test
      # conftest.py deriva DATABASE_URL de TEST_DATABASE_URL, pero lo dejamos
      # explícito para que se entienda de dónde sale.
      DATABASE_URL: postgresql://monitor:monitor@localhost:5432/monitor_test
      # config.py aborta el arranque si falta (ver paso 0.2 del contexto).
      SECRET_KEY: clave_solo_para_ci_no_usar_en_produccion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 igual que el Dockerfile. Ojo: las dependencias pinneadas
          # (contourpy==1.3.2) no compilan en 3.14.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr la suite con cobertura
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=70 --junitxml=junit.xml

      - name: Resumen de cobertura
        # Se ejecuta aunque los tests fallen, para poder ver el detalle.
        if: always()
        run: |
          {
            echo "## Cobertura"
            echo ""
            echo '```'
            coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
