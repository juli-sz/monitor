<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Solución al Error 1: Meta Viewport para celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso | Sistema Multipaciente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background-color: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h3 class="text-center mb-4">🩺 Telemetría I.S.I.</h3>
    
    <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <!-- Solución al Error 2: Agregamos el 'for="email"' -->
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@hospital.com">
      </div>
      <div class="mb-4">
        <!-- Solución al Error 2: Agregamos el 'for="password"' -->
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="Ingresá tu contraseña">
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error-msg");
      
      try {
        const res = await fetch("http://localhost:8000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const data = await res.json();
          errorDiv.textContent = data.detail || "Error al iniciar sesión";
          errorDiv.classList.remove("d-none");
          return;
        }

        const data = await res.json();
        
        // Guardamos el token y los datos de sesión en el navegador
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("userRole", data.rol);
        localStorage.setItem("userName", data.nombre);

        // Redirigimos a la página principal
        window.location.href = "admin/panel.html";

      } catch (error) {
        errorDiv.textContent = "No se pudo conectar con el servidor.";
        errorDiv.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
