<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pacientes | Telemetría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    #sidebar { height: 100vh; position: fixed; width: 220px; }
    .main-content { margin-left: 220px; padding: 20px; }
    .card-paciente { border-left: 5px solid #0d6efd; transition: transform 0.2s; }
    .card-paciente:hover { transform: scale(1.02); }
  </style>
</head>
<body>

  <!-- Barra Lateral (Sidebar) -->
  <nav id="sidebar" class="bg-dark text-white p-3">
    <h4 class="mb-4 text-center">🩺 Telemetría</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a href="panel.html" class="nav-link text-white">📊 Panel (Index)</a></li>
      <li class="nav-item mb-2"><a href="pacientes.html" class="nav-link text-info fw-bold">👥 Pacientes</a></li>
      <li class="nav-item mb-2"><a href="equipos.html" class="nav-link text-white">📻 Equipos</a></li>
      <li class="nav-item mb-2"><a href="sensores.html" class="nav-link text-white">📈 Sensores</a></li>
      <li class="nav-item mb-2"><a href="alarmas.html" class="nav-link text-white">⚠️ Alarmas</a></li>
    </ul>
    <div class="mt-auto pt-4">
      <button class="btn btn-outline-danger w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Lista de Pacientes</h3>
      <button class="btn btn-success d-none" id="btn-nuevo-paciente" onclick="abrirModal()">+ Nuevo Paciente</button>
    </div>

    <div class="row" id="contenedor-pacientes"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalPaciente" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Paciente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formPaciente">
            <input type="hidden" id="id_paciente">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="apellido" required>
            </div>
            <div class="mb-3">
              <label for="dni" class="form-label">DNI</label>
              <input type="text" class="form-control" id="dni" required>
            </div>
            <div class="mb-3">
              <label for="sexo" class="form-label">Sexo</label>
              <select class="form-select" id="sexo">
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "http://localhost:8000/pacientes";
    const token = localStorage.getItem("token");
    const userRole = localStorage.getItem("userRole");
    const modal = new bootstrap.Modal(document.getElementById('modalPaciente'));

    // Seguridad
    if (!token) window.location.replace("../login.html");
    if (userRole === "admin") document.getElementById("btn-nuevo-paciente").classList.remove("d-none");

    async function cargarPacientes() {
      try {
        const res = await fetch(API_URL, { headers: { "Authorization": `Bearer ${token}` } });
        const data = await res.json();
        const contenedor = document.getElementById("contenedor-pacientes");
        contenedor.innerHTML = "";

        data.forEach(p => {
          const botonesAdmin = userRole === "admin" ? `
            <div class="mt-3 pt-2 border-top">
              <button class="btn btn-sm btn-outline-primary" onclick="abrirModal(${p.id_paciente}, '${p.nombre}', '${p.apellido}', '${p.dni}', '${p.sexo}')">Editar</button>
              <button class="btn btn-sm btn-outline-danger float-end" onclick="eliminarPaciente(${p.id_paciente})">Dar de Baja</button>
            </div>
          ` : "";

          contenedor.innerHTML += `
            <div class="col-md-4 mb-3">
              <div class="card card-paciente shadow-sm">
                <div class="card-body">
                  <h5 class="card-title text-dark">${p.nombre} ${p.apellido}</h5>
                  <p class="card-text mb-0 text-muted"><small>DNI: ${p.dni}</small></p>
                  <p class="card-text mb-1 text-muted"><small>Sexo: ${p.sexo}</small></p>
                  ${botonesAdmin}
                </div>
              </div>
            </div>
          `;
        });
      } catch (e) { alert("Error al cargar pacientes"); }
    }

    function abrirModal(id = "", nombre = "", apellido = "", dni = "", sexo = "M") {
      document.getElementById("id_paciente").value = id;
      document.getElementById("nombre").value = nombre;
      document.getElementById("apellido").value = apellido;
      document.getElementById("dni").value = dni;
      document.getElementById("sexo").value = sexo;
      document.getElementById("modalTitle").innerText = id ? "Editar Paciente" : "Nuevo Paciente";
      modal.show();
    }

    document.getElementById("formPaciente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("id_paciente").value;
      const payload = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        dni: document.getElementById("dni").value,
        sexo: document.getElementById("sexo").value
      };

      const url = id ? `${API_URL}/${id}` : API_URL;
      const method = id ? "PATCH" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        
        if (res.ok) {
          modal.hide();
          cargarPacientes();
        } else {
          const err = await res.json();
          alert(err.detail || "Error al guardar");
        }
      } catch (error) { alert("Error de conexión"); }
    });

    async function eliminarPaciente(id) {
      if (!confirm("¿Seguro que deseas eliminar este paciente del sistema?")) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
        if (res.ok) cargarPacientes();
        else alert("Error al eliminar.");
      } catch (e) { alert("Error de conexión"); }
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.replace("../login.html");
    }

    // Iniciar
    cargarPacientes();
  </script>
</body>
</html>
