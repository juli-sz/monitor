<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor en Tiempo Real | Telemetría</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    
    /* Estructura Base */
    #sidebar { height: 100vh; position: fixed; width: 220px; top: 0; left: 0; z-index: 1000; }
    .main-content { margin-left: 220px; padding: 20px; }
    
    /* Estilos para las tarjetas de signos vitales (inyectadas por app.js) */
    .sensor-card { 
      transition: transform 0.2s; 
      border-left: 4px solid #0dcaf0; 
      margin-bottom: 20px;
    }
    .sensor-card:hover { transform: scale(1.02); }
    .label { font-weight: bold; margin-bottom: 0; color: #6c757d; font-size: 0.9em; }
    .sensor-value { font-size: 1.5em; font-weight: bold; margin-bottom: 10px; }
    
    /* Estilo para emergencias */
    .alerta-activa { 
      border-left: 5px solid #dc3545 !important; 
      animation: parpadeo 1.5s infinite; 
    }
    @keyframes parpadeo { 
      0% { background-color: white; } 
      50% { background-color: #ffe6e6; } 
      100% { background-color: white; } 
    }
  </style>
</head>
<body>

  <!-- Barra Lateral (Sidebar) -->
  <nav id="sidebar" class="bg-dark text-white p-3">
    <h4 class="mb-4 text-center">🩺 Telemetría</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a href="panel.html" class="nav-link text-info fw-bold">📊 Panel (Index)</a></li>
      <li class="nav-item mb-2"><a href="pacientes.html" class="nav-link text-white">👥 Pacientes</a></li>
      <li class="nav-item mb-2"><a href="equipos.html" class="nav-link text-white">📻 Equipos</a></li>
      <li class="nav-item mb-2"><a href="sensores.html" class="nav-link text-white">📈 Sensores</a></li>
      <li class="nav-item mb-2"><a href="alarmas.html" class="nav-link text-white">⚠️ Alarmas</a></li>
    </ul>
    <div class="mt-auto pt-4">
      <button class="btn btn-outline-danger w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Monitor en Tiempo Real</h3>
      
      <div class="w-25">
        <input type="text" id="buscador-pacientes" class="form-control" placeholder="🔍 Buscar paciente o equipo...">
      </div>
      
      <!-- Botón fantasma: app.js lo busca para el evento 'click', lo ocultamos para no romper el script -->
      <button id="menu-toggle" class="d-none" aria-label="Toggle Menu"></button>
    </div>

    <!-- Contenedor donde app.js inyecta las tarjetas de los pacientes por WebSockets -->
    <div class="row" id="contenedor-pacientes">
      <div class="col-12">
        <p class="text-muted" id="mensaje-espera">Esperando conexión de equipos...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Función local para el botón de la barra lateral
    function cerrarSesion() {
      localStorage.clear();
      window.location.replace("../login.html");
    }

    // Pequeño script visual: Oculta el mensaje de "Esperando conexión" cuando app.js inyecta la primer tarjeta
    const observer = new MutationObserver(() => {
      const mensaje = document.getElementById("mensaje-espera");
      if (document.querySelectorAll(".sensor-card").length > 0 && mensaje) {
        mensaje.style.display = "none";
      }
    });
    observer.observe(document.getElementById("contenedor-pacientes"), { childList: true });
  </script>

  <!-- Script principal de conexión a WebSockets y renderizado (Saliendo una carpeta atrás) -->
  <script src="../app.js"></script>
</body>
</html>
